# Weekly dependency updates. Two ecosystems:
#
#   - gomod: Go module dependencies (go.mod / go.sum at the repo root, the
#     dev tools in tools/go.mod, and each nested module).
#   - github-actions: the actions pinned by SHA in .github/workflows/.
#     Bumps here are how the SHA-pinned actions get updated deliberately.
#
# Minor and patch updates are grouped into one PR per ecosystem; majors arrive
# individually. No ignore rules.
# Dependabot PRs go through the same gate as any other: CI green + review.

version: 2
updates:
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  # The dev tools (formatters, linter), tracked in their own module.
  - package-ecosystem: gomod
    directory: "/tools"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  # Each nested module (ADR 0002) has its own go.mod.
  - package-ecosystem: gomod
    directory: "/tokenize/tiktoken"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
